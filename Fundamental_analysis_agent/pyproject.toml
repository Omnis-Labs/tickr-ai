[project]
name = "fundamental-analysis-agent"
version = "0.1.0"
description = "Fundamental Analysis Agent LLM Engineer review — browser agent + 10-K extractor"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sse-starlette>=2.1",
    "anthropic>=0.39",
    "openai>=1.54",
    "google-genai>=0.3",
    "playwright>=1.48",
    "beautifulsoup4>=4.12",
    "lxml>=5.3",
    "httpx>=0.27",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.20",
    "asyncpg>=0.30",
    "alembic>=1.13",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "structlog>=24.4",
    "tenacity>=9.0",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "yfinance>=0.2",
    "pypdf>=5.0",
    "ephem>=4.1",
    "lunardate>=0.2",
]

[project.optional-dependencies]
# T28 紫微斗數 runs on a pure-Python engine (task28_ziwei/pipeline/ziwei_core.py; only
# needs lunardate, deploys anywhere). py-iztro is kept dev-only as the ORACLE that
# ziwei_core was verified against — it pulls pythonmonkey→pminit, which has NO linux
# wheels, so it must never be a runtime/prod dependency.
divination = ["py-iztro==0.1.5"]
dev = [
    "py-iztro==0.1.5",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.7",
    "mypy>=1.13",
    "httpx>=0.27",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["task1_browser_agent", "task2_10k_extractor", "shared", "task3_strategy", "task4_technical", "task5_ensemble", "task6_insider", "task7_relative", "task8_earnings", "task9_institutional", "task10_portfolio", "task11_fundamentals_trend", "task12_seasonality", "task13_overnight", "task14_volatility", "task15_buyback", "task16_short", "task17_quality", "task18_events", "task19_anomaly", "task20_vix", "task21_ranker", "task22_congress", "task23_pairs", "task24_contagion", "task25_astro", "task26_meihua", "task27_bazi", "task28_ziwei", "task29_suimei"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shared", "task1_browser_agent", "task2_10k_extractor", "task3_strategy", "task4_technical", "task5_ensemble", "task6_insider", "task7_relative", "task8_earnings", "task9_institutional", "task10_portfolio", "task11_fundamentals_trend", "task12_seasonality", "task13_overnight", "task14_volatility", "task15_buyback", "task16_short", "task17_quality", "task18_events", "task19_anomaly", "task20_vix", "task21_ranker", "task22_congress", "task23_pairs", "task24_contagion", "task25_astro", "task26_meihua", "task27_bazi", "task28_ziwei", "task29_suimei"]
